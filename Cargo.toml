[package]
name = "xvc-py"
version = "0.7.1-alpha.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xvc"
crate-type = ["cdylib"]

[dependencies]
log = "^0.4"

xvc_rust = { package = "xvc", git = "https://github.com/iesahin/xvc", branch = "main", version = "0.7.1-alpha.5", features = [
  "reflink",
  "bundled-openssl",
  "bundled-sqlite",
] }

xvc_logging = { package = "xvc-logging", git = "https://github.com/iesahin/xvc", branch = "main", version = "0.7.1-alpha.5" }
xvc_config = { package = "xvc-config", git = "https://github.com/iesahin/xvc", branch = "main", version = "0.7.1-alpha.5" }
xvc_walker = { package = "xvc-walker", git = "https://github.com/iesahin/xvc", branch = "main", version = "0.7.1-alpha.5" }

# xvc_rust = { package = "xvc", path = "../xvc/lib/" }
# xvc_walker = { package = "xvc-walker", path = "../xvc/walker/" }
# xvc_logging = { package = "xvc-logging", path = "../xvc/logging/" }

crossbeam-channel = "^0.5"
crossbeam = "^0.8"
# Same clap Xvc's CLI is derived with, to parse a command line without letting
# clap exit the interpreter. See `parse_cli` in src/lib.rs.
clap = { version = "^4.5", features = ["derive"] }
# abi3-py38: PyO3 0.25 dropped Python 3.7, so this is the oldest interpreter a
# single abi3 wheel can still target. Keep `requires-python` in pyproject.toml
# in step with it.
pyo3 = { version = "^0.29", features = ["extension-module", "abi3-py38"] }
git-version = "^0.3"
